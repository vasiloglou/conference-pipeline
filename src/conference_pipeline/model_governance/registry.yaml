schema_version: 1
description: >
  Platform-owned task/model registry. Model names here are planning defaults
  only; selected live production defaults still require dated current research,
  provider approval, and stage-local benchmark receipts.

# Local runtime profile extension (Phase 7+):
# Tasks that support local execution may add:
#   local_runtime_profile_id: mlx_light   # references local_runtime_profiles.yaml
# Until a task has a benchmark receipt and operator approval, local_runtime_policy
# must remain "deferred_until_*" and local_runtime_profile_id is omitted.
#
# Profile definitions: src/conference_pipeline/model_governance/local_runtime_profiles.yaml
# Profile schema and loader: src/conference_pipeline/model_governance/local_runtime.py
# Proof chain documentation: docs/reference/local-runtime.md

tasks:
  analysis.local_summary_benchmark:
    task_family: analysis
    stage: analysis
    model_ref: qwen36_local
    budget_cap_usd: 25
    current_research:
      required: true
      status: experimental_short_context_comparison
      reference: docs/operations/local-summary-benchmark.md
    benchmark:
      required: true
      receipt_required: true
    quality_threshold: source-grounded noninferiority pilot; no production promotion
    schema_validity_required: true
    provenance_required: true
    local_runtime_policy: isolated_experiment_only_serial_gpu
    selection_status: experimental_not_production
    allowed_selections:
      - {provider: local, model: mlx-community/Qwen3.6-35B-A3B-OptiQ-4bit, role: default}
      - {provider: local, model: mlx-community/Qwen3.8-27B-4bit, role: candidate}
      - {provider: openai, model: gpt-6-luna, role: bounded_synthesis}
      - {provider: openai, model: gpt-6-sol, role: independent_evaluator}
      - {provider: openrouter, model: openrouter/moonshotai/kimi-k3, role: cloud_comparator}
  transcription.session_speech:
    task_family: transcription
    stage: transcription-ocr
    model_ref: gpt4o_transcribe_diarize
    fallback_model_ref: whisper_local
    budget_cap_usd: 200
    current_research:
      required: true
      status: pending_for_new_milestones
      reference: src/conference_pipeline/costs/pricing_catalog.json
    benchmark:
      required: true
      placement: after representative audio or video samples are downloaded
      receipt_required: true
      authority_models: [gpt-4o-transcribe-diarize]
      candidates: [gpt-4o-mini-transcribe, whisper-1]
    quality_threshold: speaker-aware transcript with source timestamps or explicit blocker
    schema_validity_required: false
    provenance_required: true
    local_runtime_policy: deferred_until_local_runtime_receipts
    local_candidates:
      - model_id: "mlx-community/whisper-large-v3-mlx"
        source_url: "https://huggingface.co/mlx-community/whisper-large-v3-mlx"
        checked_date: "2026-04-27"
        source_class: "community_runtime_report"
        runtime_support: "mlx_community_tested"
        license: "mit"
        commercial_use_allowed: true
        expected_memory_gb: 3.2
        status: benchmark_pending
        benchmark_receipt_ref: ".planning/workstreams/skill-improvements-iclr2025/phases/09-benchmark-harness-and-target-mac-receipts/receipts/transcription.session_speech/mlx-community_whisper-large-v3-mlx.json"
    selection_status: planning_default_requires_stage_receipt
    local_proof: {}
    allowed_selections:
      - {provider: openai, model: gpt-4o-transcribe-diarize, role: default}
      - {provider: openai, model: gpt-4o-transcribe, role: candidate}
      - {provider: openai, model: gpt-4o-mini-transcribe, role: cheaper_candidate}
      - {provider: local, model: whisper-1, role: deferred_local_candidate}

  transcription.youtube_url:
    task_family: transcription
    stage: acquisition
    model_ref: gemini_flash_lite
    fallback_model_ref: gemini_pro
    # Raised 25 -> 100 on 2026-09-17 by operator decision, to cover the full
    # CVPR 2026 poster-video backlog (~1,400 five-minute videos) in one run.
    # Headroom, not a forecast: that backlog prices at ~$5-10, the lane halts
    # rather than crossing this cap, and the $800 global provider cap still
    # governs the workspace.
    budget_cap_usd: 100
    current_research:
      required: true
      status: current
      reference: docs/reference/stage-owner-audit.md#acquisition-youtube-talk-harvest
      checked_date: "2026-09-17"
      notes: >
        Gemini accepts a public YouTube URL as file_data and fetches it
        server-side, so it works while the local IP is bot-gated by YouTube.
        It transcribes the speech (it does not read the caption track).
        Measured 2026-09-17 on CVPR 2026 videos with gemini_flash_lite: ~0.90
        word-sequence agreement with YouTube auto-captions on a 5-minute
        poster video; clean transcript of a caption-less tutorial; fps 0.02 +
        low media resolution cut prompt tokens ~3.4x vs the 1 fps default
        with an essentially identical transcript (~$0.04-0.05 per hour).
        Offsets past the video end return a bare HTTP 500, so the duration
        must come from the watch page first.
    benchmark:
      required: true
      placement: after the first live video-list run, compare Gemini windows against YouTube captions on captioned talks
      receipt_required: true
      authority_models: [gemini-3.1-pro-preview]
      candidates: [gemini-3.5-flash-lite]
    quality_threshold: verbatim speech transcript per time window that a reader can quote technical terms, model names, and numbers from, or an explicit per-video gap
    schema_validity_required: false
    provenance_required: true
    local_runtime_policy: not_applicable_remote_url_ingestion
    selection_status: planning_default_requires_stage_receipt
    local_proof: {}
    allowed_selections:
      - {provider: gemini, model: gemini-3.5-flash-lite, role: default}
      - {provider: gemini, model: gemini-3.1-pro-preview, role: authority_candidate}

