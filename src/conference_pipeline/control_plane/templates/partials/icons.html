{% macro icon(name) -%}
  {% if name == "launch" %}
    <svg aria-hidden="true" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2.5 13.5l3-1 7-7-2-2-7 7-1 3z"></path>
      <path d="M9.5 4.5l2 2"></path>
    </svg>
  {% elif name == "resume" %}
    <svg aria-hidden="true" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 8a5 5 0 1 0 1.5-3.5"></path>
      <path d="M3 3.5v3h3"></path>
      <path d="M7 5.5l3 2.5-3 2.5z"></path>
    </svg>
  {% elif name == "refresh" %}
    <svg aria-hidden="true" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13 5a5 5 0 0 0-8.5-2"></path>
      <path d="M13 2.5V5h-2.5"></path>
      <path d="M3 11a5 5 0 0 0 8.5 2"></path>
      <path d="M3 13.5V11h2.5"></path>
    </svg>
  {% elif name == "preview" %}
    <svg aria-hidden="true" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1.75 8s2.25-4 6.25-4 6.25 4 6.25 4-2.25 4-6.25 4-6.25-4-6.25-4z"></path>
      <circle cx="8" cy="8" r="1.75"></circle>
    </svg>
  {% elif name == "copy" %}
    <svg aria-hidden="true" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="5" width="8" height="8" rx="1"></rect>
      <path d="M3 11H2.5A1.5 1.5 0 0 1 1 9.5v-7A1.5 1.5 0 0 1 2.5 1h7A1.5 1.5 0 0 1 11 2.5V3"></path>
    </svg>
  {% elif name == "external-open" %}
    <svg aria-hidden="true" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 3.5H3.5A1.5 1.5 0 0 0 2 5v7.5A1.5 1.5 0 0 0 3.5 14H11a1.5 1.5 0 0 0 1.5-1.5V10"></path>
      <path d="M9 2h5v5"></path>
      <path d="M8 8l6-6"></path>
    </svg>
  {% endif %}
{%- endmacro %}
