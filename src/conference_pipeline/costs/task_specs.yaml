    enabled_by: presentation_enrichment_enabled
    notes: "Paper-grounded enrichment and correction for generated decks. claude-haiku-4-5-20251001 was retired 2026-07-15 (quick-260715-rz1) in favor of claude-sonnet-5; all three tiers now share the same model."

  - task_id: slide_consolidation
    family: presentation_generation
    stage: presentation
    provider: gemini
    pricing_unit: tokens
    quantity_source: presentation_targets
    input_tokens_per_unit: 25000
    output_tokens_per_unit: 10000
    models:
      low: gemini-3.5-flash-lite
      base: gemini-3.1-pro-preview
