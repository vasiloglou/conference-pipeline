  - task_id: notebooklm_audio_overview
    family: podcast_generation
    stage: notebooklm-podcast
    provider: google_notebooklm
    pricing_unit: none
    quantity_source: fixed
    fixed_usd: 0.0
    models:
      low: notebooklm-audio-overview
      base: notebooklm-audio-overview
      high: notebooklm-audio-overview
    enabled_by: always
