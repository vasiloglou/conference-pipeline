      base: gpt-4o-mini-tts
      high: gpt-4o-mini-tts
    enabled_by: podcast_tts_enabled
    notes: "Rendered focused podcast or narration audio."

  - task_id: deck_draft_generation
    family: presentation_generation
    stage: presentation
    provider: gemini
    pricing_unit: tokens
    quantity_source: presentation_targets
    input_tokens_per_unit: 80000
