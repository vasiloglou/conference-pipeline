    models:
      low: claude-opus-5-5
      base: claude-opus-5-5
      high: claude-opus-5-5
    enabled_by: podcast_script_enabled
    notes: "Focused podcast and narration script generation with Claude Opus 4.8."

  - task_id: openai_podcast_tts
    family: podcast_generation
    stage: podcast
    provider: openai
    pricing_unit: tts_minute_estimate
    quantity_source: topic_count
    target_minutes_per_unit:
