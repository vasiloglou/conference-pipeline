[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conference-pipeline"
version = "0.1.0"
description = "Generic conference data extractor for NeurIPS Foundation conferences (NeurIPS, ICML, ICLR, MLSys)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Nikolaos Vasiloglou"}
]
keywords = ["neurips", "icml", "iclr", "mlsys", "conference", "transcription", "ocr", "slides"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "Markdown>=3.5",  # public site narratives (v6.0 Phase 4)
    "lxml>=4.9.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "typer>=0.9.0",
    "fastapi>=0.136.0",
    "uvicorn>=0.45.0",
    "jinja2>=3.1.6",
    "Pillow>=10.0.0",
    "python-pptx>=0.6.23",
    "pypdf>=4.0.0",
    "gpt-researcher==0.16.1",
    "chromadb>=1.4.0",
    "svgwrite>=1.4.3",
    "drawsvg>=2.4.0",
    "regex>=2024.4",  # ontology predicate check: Unicode (UAX #29) word boundaries (v6.1 PR 50 F7)
    "spacy>=3.8",  # ontology predicate check: English contraction table, no model download (v6.1 PR 50 F7)
    "nltk>=3.9",  # ontology predicate check: Snowball stemmer, no data download (v6.1 PR 50 F7)
]

[project.entry-points."gpt_researcher.retrievers"]
# GPT-Researcher searches only our hybrid index (Chroma + stored BM25, RRF);
# see src/conference_pipeline/research/gptr_retriever.py.
local_hybrid = "conference_pipeline.research.gptr_retriever:LocalHybridRetriever"

[project.optional-dependencies]
browser = [
    "playwright>=1.40.0",
]
media = [
    "yt-dlp==2026.3.17",
    "pymupdf>=1.23.0",
    "imagehash>=4.3.0",
    "imageio-ffmpeg>=0.4.9",
]
ocr = [
    "pytesseract>=0.3.10",
]
transcription = [
    "openai>=1.3.0",
]
llm = [
    "openai>=1.3.0",
    "anthropic>=0.7.0",
    "google-genai>=1.0.0",
]
mlx = [
    "mlx-lm>=0.15.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-embeddings>=0.0.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # v1.61 vision lane (mlx-vlm covers vllm-mlx server + apple/FastVLM-MLX
    # native checkpoints). Loose floor; tighten once benchmark receipts land.
    "mlx-vlm>=0.1.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
ollama = []  # marker extra; uses transitive httpx, no new wheels
logging = [
    "structlog>=23.2.0",
]
publishing = [
    "sqlite-vec>=0.1.9",
    "sentence-transformers>=5.6.0",   # build-time embeddinggemma 768-dim runtime (RESEARCH-preferred default)
    # ONNX-parity fallback: swap sentence-transformers for optimum[onnxruntime]>=2.2.0
    # if the Plan 04 parity spot-check shows cosine drift > threshold (D-10 open question 1).
]
notebooklm = [
    # Per-deck NotebookLM podcast lane (conference_pipeline.podcast_notebooklm).
    # [browser] for the interactive login fallback, [cookies] for
    # `notebooklm login --browser-cookies chrome`. Exact pin: the engine
    # version actually used is recorded per run in notebook_manifest.json.
    "notebooklm-py[browser,cookies]==0.8.2",
    # Local listening review of generated episodes (transcribe + check).
    "mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
all = [
    "conference-pipeline[browser,media,ocr,transcription,llm,mlx,ollama,logging,publishing,notebooklm]",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.10.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
    "pytest-xdist>=3.0.0",
]

[project.scripts]
conference-pipeline = "conference_pipeline.cli:main"

[project.urls]
Homepage = "https://github.com/vasiloglou/conference-pipeline"
Documentation = "https://github.com/vasiloglou/conference-pipeline/tree/main/docs"
Repository = "https://github.com/vasiloglou/conference-pipeline"

[tool.setuptools.packages.find]
where = ["src"]
include = ["conference_pipeline*", "utils*", "prompts*"]

[tool.setuptools.package-data]
"conference_pipeline" = ["stage_owner_registry.json"]
"conference_pipeline.control_plane" = ["templates/*.html", "templates/partials/*.html", "static/*"]
"conference_pipeline.costs" = ["pricing_catalog.json", "task_specs.yaml"]
"conference_pipeline.model_governance" = ["*.yaml", "*.json"]
"conference_pipeline.ontology" = ["vocabulary/*.orm.yaml"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "live_llm: requires a real local LLM endpoint and RUN_LIVE_LLM=1",
    "legacy_http_mock: quarantined mocked local-LLM tests retained for regression only",
    "repo_data(*paths): reads repository files the public code export does not carry; skipped, naming the first missing path, when one is absent",
    "local_e2e: v1.9 Phase 47 — end-to-end exercise of the local lane (MLX/Ollama embeddings + LocalLLMResearcher); requires RUN_LOCAL_E2E=1",
]
