<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fc-title fc-desc">
<title id="fc-title">Staying on the data manifold</title>
<desc id="fc-desc">Tangent updates keep the sample on the manifold; unconstrained steps leave it.</desc>
