<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fc-title fc-desc">
<title id="fc-title">Where visual reasoning fails</title>
<desc id="fc-desc">More than half of the failures come from insufficient exploration.</desc>

<rect x="0" y="0" width="1280" height="720" fill="#1a1a2e" />
<text font-size="34" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-weight="bold"><tspan x="44" y="70.52">Where visual reasoning fails</tspan></text>
<text font-size="24" fill="#a8d8ea" font-family="Helvetica, Arial, sans-serif"><tspan x="44" y="108.72">More than half of the failures come from insufficient exploration.</tspan></text>
<text font-size="24" fill="#ffd43b" font-family="Helvetica, Arial, sans-serif"><tspan x="44" y="665.44">Exploration causes most failures</tspan></text>
<text x="44" y="150" font-size="20" fill="#cccccc" font-family="Helvetica, Arial, sans-serif">Failure cases by cause</text>
<rect x="44" y="164" width="655.6" height="96" fill="#ffd43b" />
<text x="371.8" y="219" font-size="20" fill="#1a1a2e" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-weight="bold">55%</text>
<rect x="699.6" y="164" width="321.84" height="96" fill="#4ecdc4" />
<text x="860.52" y="219" font-size="20" fill="#1a1a2e" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-weight="bold">27%</text>
<rect x="1021.44" y="164" width="214.56" height="96" fill="#9775fa" />
<text x="1128.72" y="219" font-size="20" fill="#1a1a2e" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-weight="bold">18%</text>
<rect x="44" y="286" width="16" height="16" fill="#ffd43b" />
<text font-size="20" fill="#e0e0e0" font-family="Helvetica, Arial, sans-serif"><tspan x="70" y="297.6">Insufficient exploration -55%</tspan></text>
<rect x="448" y="286" width="16" height="16" fill="#4ecdc4" />
<text font-size="20" fill="#e0e0e0" font-family="Helvetica, Arial, sans-serif"><tspan x="474" y="297.6">No backtracking -27%</tspan></text>
<rect x="852" y="286" width="16" height="16" fill="#9775fa" />
<text font-size="20" fill="#e0e0e0" font-family="Helvetica, Arial, sans-serif"><tspan x="878" y="297.6">Perception error -18%</tspan></text>
</svg>
