<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fc-title fc-desc">
<title id="fc-title">Watermark recovery under motion</title>
<desc id="fc-desc">The watermark survives motion and paraphrase attacks in most trials.</desc>

<rect x="0" y="0" width="1280" height="720" fill="#1a1a2e" />
<text font-size="34" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-weight="bold"><tspan x="44" y="70.52">Watermark recovery under motion</tspan></text>
<text font-size="24" fill="#a8d8ea" font-family="Helvetica, Arial, sans-serif"><tspan x="44" y="108.72">The watermark survives motion and paraphrase attacks in most trials.</tspan></text>
<text font-size="24" fill="#ffd43b" font-family="Helvetica, Arial, sans-serif"><tspan x="44" y="665.44">Watermarks survive most attacks</tspan></text>
<rect x="44" y="276.53" width="583" height="209.66" fill="#16213e" rx="10" stroke="#ffd43b" stroke-width="4" />
<text font-size="64" fill="#ffd43b" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-weight="bold"><tspan x="335.5" y="356.45">85.0%</tspan></text>
<text font-size="20" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="335.5" y="414.21">watermark recovery under motion</tspan></text>
<text font-size="19" fill="#cccccc" font-family="Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="335.5" y="447.83">measured across the attack suite</tspan></text>
<rect x="653" y="293.12" width="583" height="176.48" fill="#16213e" rx="10" stroke="#333344" stroke-width="2.5" />
<text font-size="64" fill="#a8d8ea" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-weight="bold"><tspan x="944.5" y="373.04">24.4%</tspan></text>
<text font-size="20" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="944.5" y="430.8">fewer tokens with EVATok</tspan></text>
</svg>
