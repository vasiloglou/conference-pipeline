<text x="193" y="310.96" font-size="20" fill="#cccccc" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">baseline</text>
<text font-size="20" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="193" y="336.56">CLIP contrastive pretraining</tspan></text>
<circle cx="491" cy="381.36" r="6" fill="#a8d8ea" />
<rect x="490.25" y="381.36" width="1.5" height="30" fill="#a8d8ea" />
<text x="491" y="435.36" font-size="20" fill="#cccccc" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">next</text>
<text font-size="20" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="491" y="460.96">SigLIP pairwise sigmoid loss</tspan></text>
<circle cx="789" cy="381.36" r="6" fill="#a8d8ea" />
<rect x="788.25" y="351.36" width="1.5" height="30" fill="#a8d8ea" />
<text x="789" y="310.96" font-size="20" fill="#cccccc" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">then</text>
<text font-size="20" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="789" y="336.56">Hard-negative mining</tspan></text>
<circle cx="1087" cy="381.36" r="6" fill="#a8d8ea" />
