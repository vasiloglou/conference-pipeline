<text font-size="24" fill="#a8d8ea" font-family="Helvetica, Arial, sans-serif"><tspan x="44" y="108.72">Each step in this lineage fixed a specific weakness of the one before it.</tspan></text>
<text font-size="24" fill="#ffd43b" font-family="Helvetica, Arial, sans-serif"><tspan x="44" y="665.44">Each step fixed the last one&#x27;s blind spot</tspan></text>
<text x="1236" y="671.82" font-size="19" fill="#cccccc" font-family="Helvetica, Arial, sans-serif" text-anchor="end">schematic - illustrates the claim, not measured data</text>
