<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fc-title fc-desc">
<title id="fc-title">Language priors against pixel evidence</title>
<desc id="fc-desc">On coarse questions language priors win; fine-grained questions need the pixels.</desc>

<rect x="0" y="0" width="1280" height="720" fill="#1a1a2e" />
<text font-size="34" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-weight="bold"><tspan x="44" y="70.52">Language priors against pixel evidence</tspan></text>
<text font-size="24" fill="#a8d8ea" font-family="Helvetica, Arial, sans-serif"><tspan x="44" y="108.72">On coarse questions language priors win; fine-grained questions need the pixels.</tspan></text>
<text font-size="24" fill="#ffd43b" font-family="Helvetica, Arial, sans-serif"><tspan x="44" y="665.44">Coarse questions let priors win</tspan></text>
<text x="1236" y="671.82" font-size="19" fill="#cccccc" font-family="Helvetica, Arial, sans-serif" text-anchor="end">schematic - illustrates the claim, not measured data</text>
<polyline points="234.72,410.54 1045.28,352.18" fill="none" stroke="#a8d8ea" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
<polygon points="640,389.36 614,443.36 666,443.36" fill="#2a2a4a" stroke="#a8d8ea" stroke-width="2.5" />
<line x1="234.72" y1="410.54" x2="234.72" y2="436.54" stroke="#a8d8ea" stroke-width="2.5" stroke-linecap="round" />
<rect x="107.77" y="436.54" width="253.9" height="57.72" fill="#16213e" rx="10" stroke="#a8d8ea" stroke-width="2.5" />
<text font-size="26" fill="#a8d8ea" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-weight="bold"><tspan x="234.72" y="469.82">Language priors</tspan></text>
<text font-size="20" fill="#e0e0e0" font-family="Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="234.72" y="521.86">Plausible answers without looking</tspan></text>
<line x1="1045.28" y1="352.18" x2="1045.28" y2="378.18" stroke="#4ecdc4" stroke-width="2.5" stroke-linecap="round" />
<rect x="931.19" y="378.18" width="228.18" height="57.72" fill="#16213e" rx="10" stroke="#4ecdc4" stroke-width="2.5" />
<text font-size="26" fill="#4ecdc4" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-weight="bold"><tspan x="1045.28" y="411.46">Pixel evidence</tspan></text>
<text font-size="20" fill="#e0e0e0" font-family="Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="1045.28" y="463.5">Only consulted when the question forces</tspan><tspan x="1045.28" y="487.9">it</tspan></text>
<text font-size="20" fill="#ffd43b" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-weight="bold"><tspan x="640" y="317.38">Answer on a coarse question</tspan></text>
<rect x="639.25" y="330.18" width="1.5" height="47.18" fill="#333344" />
</svg>
