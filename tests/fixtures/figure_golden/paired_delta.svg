<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fc-title fc-desc">
<title id="fc-title">Pruning visual tokens without paying for it</title>
<desc id="fc-desc">HAWK prunes most visual tokens while keeping almost all of the accuracy.</desc>

<rect x="0" y="0" width="1280" height="720" fill="#1a1a2e" />
<text font-size="34" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-weight="bold"><tspan x="44" y="70.52">Pruning visual tokens without paying for it</tspan></text>
<text font-size="24" fill="#a8d8ea" font-family="Helvetica, Arial, sans-serif"><tspan x="44" y="108.72">HAWK prunes most visual tokens while keeping almost all of the accuracy.</tspan></text>
<text font-size="24" fill="#ffd43b" font-family="Helvetica, Arial, sans-serif"><tspan x="44" y="665.44">80% fewer tokens, 96% of the accuracy</tspan></text>
<text x="44" y="148.8" font-size="21" fill="#cccccc" font-family="Helvetica, Arial, sans-serif">Accuracy retained (%)</text>
<circle cx="188.53" cy="170.85" r="7" fill="#cccccc" />
<text x="202.53" y="178.2" font-size="21" fill="#cccccc" font-family="Helvetica, Arial, sans-serif">before</text>
<circle cx="297.04" cy="170.85" r="8" fill="#a8d8ea" />
<text x="311.04" y="178.2" font-size="21" fill="#a8d8ea" font-family="Helvetica, Arial, sans-serif">after</text>
<rect x="183.78" y="195" width="1.5" height="389.52" fill="#333344" opacity="0.45" />
<text x="184.53" y="613.92" font-size="21" fill="#cccccc" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">0</text>
<rect x="382.63" y="195" width="1.5" height="389.52" fill="#333344" opacity="0.45" />
<text x="383.38" y="613.92" font-size="21" fill="#cccccc" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">25</text>
<rect x="581.47" y="195" width="1.5" height="389.52" fill="#333344" opacity="0.45" />
<text x="582.22" y="613.92" font-size="21" fill="#cccccc" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">50</text>
<rect x="780.32" y="195" width="1.5" height="389.52" fill="#333344" opacity="0.45" />
<text x="781.07" y="613.92" font-size="21" fill="#cccccc" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">75</text>
<rect x="979.17" y="195" width="1.5" height="389.52" fill="#333344" opacity="0.45" />
<text x="979.92" y="613.92" font-size="21" fill="#cccccc" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">100</text>
<line x1="979.92" y1="288.38" x2="948.1" y2="288.38" stroke="#ffd43b" stroke-width="4" stroke-linecap="round" />
<circle cx="979.92" cy="288.38" r="7" fill="#cccccc" />
<circle cx="948.1" cy="288.38" r="9" fill="#ffd43b" />
<text font-size="21" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" text-anchor="end" font-weight="bold"><tspan x="170.53" y="291.95">HAWK</tspan></text>
<text x="991.92" y="295.73" font-size="21" fill="#ffd43b" font-family="Helvetica, Arial, sans-serif" font-weight="bold">96.0% at 19.8% tokens</text>
<line x1="979.92" y1="491.14" x2="956.85" y2="491.14" stroke="#4ecdc4" stroke-width="4" stroke-linecap="round" />
<circle cx="979.92" cy="491.14" r="7" fill="#cccccc" />
<circle cx="956.85" cy="491.14" r="9" fill="#4ecdc4" />
<text font-size="21" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" text-anchor="end" font-weight="bold"><tspan x="170.53" y="494.71">TransPrune</tspan></text>
<text x="991.92" y="498.49" font-size="21" fill="#4ecdc4" font-family="Helvetica, Arial, sans-serif" font-weight="bold">97.1% at 34% tokens</text>
</svg>
