<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fc-title fc-desc">
<title id="fc-title">Width versus depth in visual reasoning</title>
<desc id="fc-desc">Most failures come from too little exploration, not from shallow chains.</desc>

<rect x="0" y="0" width="1280" height="720" fill="#1a1a2e" />
<text font-size="34" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-weight="bold"><tspan x="44" y="70.52">Width versus depth in visual reasoning</tspan></text>
<text font-size="24" fill="#a8d8ea" font-family="Helvetica, Arial, sans-serif"><tspan x="44" y="108.72">Most failures come from too little exploration, not from shallow chains.</tspan></text>
<text font-size="24" fill="#ffd43b" font-family="Helvetica, Arial, sans-serif"><tspan x="44" y="665.44">Explore wider before reasoning deeper</tspan></text>
<rect x="56.6" y="163.5" width="1179.4" height="395.82" fill="#16213e" stroke="#333344" stroke-width="1.5" />
<rect x="645.55" y="163.5" width="1.5" height="395.82" fill="#333344" />
<rect x="56.6" y="360.66" width="1179.4" height="1.5" fill="#333344" />
<text x="56.6" y="626.52" font-size="21" fill="#cccccc" font-family="Helvetica, Arial, sans-serif">narrow exploration</text>
<text x="1236" y="626.52" font-size="21" fill="#cccccc" font-family="Helvetica, Arial, sans-serif" text-anchor="end">wide exploration</text>
<text x="56.6" y="153" font-size="21" fill="#cccccc" font-family="Helvetica, Arial, sans-serif">deep chain</text>
<text x="56.6" y="584.52" font-size="21" fill="#cccccc" font-family="Helvetica, Arial, sans-serif">shallow chain</text>
<text font-size="20" fill="#cccccc" font-family="Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="351.45" y="288.06">Deep but blinkered</tspan></text>
<text font-size="20" fill="#cccccc" font-family="Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="941.15" y="243.66">Wide exploration wins</tspan></text>
<circle cx="268.89" cy="480.16" r="7" fill="#a8d8ea" />
<text font-size="20" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="268.89" y="459.36">Single-pass answer</tspan></text>
<circle cx="386.83" cy="234.75" r="7" fill="#a8d8ea" />
<text font-size="20" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="386.83" y="213.95">Long chain of thought</tspan></text>
<circle cx="1000.12" cy="274.33" r="9" fill="#ffd43b" />
<text font-size="20" fill="#ffd43b" font-family="Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="1000.12" y="301.93">Tool-integrated search</tspan></text>
<circle cx="787.83" cy="464.32" r="7" fill="#a8d8ea" />
<text font-size="20" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" text-anchor="middle"><tspan x="787.83" y="443.52">Retrieval shortcut</tspan></text>
</svg>
