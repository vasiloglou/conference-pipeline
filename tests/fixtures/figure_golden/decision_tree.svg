<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fc-title fc-desc">
<title id="fc-title">Which grounding check before release</title>
<desc id="fc-desc">The evidence a deployment needs depends on how sensitive its domain is.</desc>
<defs><marker id="fc-arrow" viewBox="-10 -5 10 10" refX="0" refY="0" markerWidth="7" markerHeight="7" orient="auto" markerUnits="strokeWidth"><path d="M-10,-4.5 L0,0 L-10,4.5 Z" fill="#a8d8ea" /></marker></defs>
<rect x="0" y="0" width="1280" height="720" fill="#1a1a2e" />
<text font-size="34" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-weight="bold"><tspan x="44" y="70.52">Which grounding check before release</tspan></text>
<text font-size="24" fill="#a8d8ea" font-family="Helvetica, Arial, sans-serif"><tspan x="44" y="108.72">The evidence a deployment needs depends on how sensitive its domain is.</tspan></text>
<text font-size="24" fill="#ffd43b" font-family="Helvetica, Arial, sans-serif"><tspan x="44" y="665.44">Sensitive domains need grounded evidence</tspan></text>
<rect x="419.46" y="132" width="441.08" height="59.72" fill="#16213e" stroke="#ffd43b" stroke-width="2.5" />
<text font-size="26" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-weight="bold"><tspan x="640" y="166.28">Is the domain safety-sensitive?</tspan></text>
<rect x="155.39" y="351.5" width="451.7" height="59.72" fill="#2a2a4a" stroke="#a8d8ea" stroke-width="2.5" />
<text font-size="26" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-weight="bold"><tspan x="381.24" y="385.78">Yes: require grounded evidence</tspan></text>
<rect x="641.08" y="351.5" width="483.53" height="59.72" fill="#2a2a4a" stroke="#a8d8ea" stroke-width="2.5" />
<text font-size="26" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-weight="bold"><tspan x="882.85" y="385.78">No: aggregate benchmark suffices</tspan></text>
<rect x="339.76" y="571" width="258.99" height="59.72" fill="#16213e" rx="10" stroke="#51cf66" stroke-width="2.5" />
<text font-size="26" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-weight="bold"><tspan x="469.25" y="605.28">Per-domain audit</tspan></text>
<rect x="632.74" y="571" width="307.5" height="59.72" fill="#16213e" rx="10" stroke="#51cf66" stroke-width="2.5" />
<text font-size="26" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" text-anchor="middle" font-weight="bold"><tspan x="786.49" y="605.28">Ship with monitoring</tspan></text>
<polyline points="640,191.72 640,246.05" fill="none" stroke="#a8d8ea" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" />
<polyline points="381.24,246.05 882.85,246.05" fill="none" stroke="#a8d8ea" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" />
