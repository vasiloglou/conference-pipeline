<line x1="882.85" y1="246.05" x2="882.85" y2="345.5" stroke="#a8d8ea" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fc-arrow)" />
<polyline points="381.24,411.22 381.24,465.55" fill="none" stroke="#a8d8ea" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" />
