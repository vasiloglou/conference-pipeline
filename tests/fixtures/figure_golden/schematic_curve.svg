<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="fc-title fc-desc">
<title id="fc-title">Confidence should fall as the image degrades</title>
<desc id="fc-desc">A calibrated model loses confidence as blur rises; the observed model does not.</desc>

<rect x="0" y="0" width="1280" height="720" fill="#1a1a2e" />
<text font-size="34" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-weight="bold"><tspan x="44" y="70.52">Confidence should fall as the image degrades</tspan></text>
<text font-size="24" fill="#a8d8ea" font-family="Helvetica, Arial, sans-serif"><tspan x="44" y="108.72">A calibrated model loses confidence as blur rises; the observed model does not.</tspan></text>
<text font-size="24" fill="#ffd43b" font-family="Helvetica, Arial, sans-serif"><tspan x="44" y="665.44">Confidence stays flat as blur rises</tspan></text>
<text x="1236" y="671.82" font-size="19" fill="#cccccc" font-family="Helvetica, Arial, sans-serif" text-anchor="end">schematic - illustrates the claim, not measured data</text>
